name: Deploy Pages

# Builds the landing page (landing-blog/) and the mkdocs documentation
# together into one site: the landing page at the root, docs at /docs/.
# Replaces the old docs-only gh-deploy workflow (see docs.yml history).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.19"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install docs dependencies
        run: uv pip install --system -e ".[docs]"

      - name: Build docs into _site/docs
        run: mkdocs build --site-dir _site/docs

      - name: Assemble landing page at site root
        run: |
          mkdir -p _site
          cp -r landing-blog/. _site/

      - name: Redirect old root-level docs routes to /docs/
        run: python3 scripts/generate_docs_redirects.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
